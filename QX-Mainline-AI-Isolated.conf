# Quantumult X V2.0 — NEW BUILD, not a patch of the old configuration
# MAINLINE v2.0.7 — unified device-acceptance candidate; private subscription stays on-device.
# Static checks passed; remote downloads, DNS behavior and real-device operation remain UNVERIFIED.
# No subscription tokens, proxy passwords, MitM certificates or scripts.
[general]
server_check_url = http://www.google.com/generate_204

[dns]
# Encrypted DNS baseline; DoH changes system DNS behavior. Test captive portal and LAN names.
# IPv6 remains enabled for compatibility; IPv6 and DNS leaks require device tests.
doh-server=https://dns.alidns.com/dns-query
server=/home.arpa/system
server=/local/system

[policy]
# AI fixed selection: no automatic cross-region switching or DIRECT fallback.
# In an outage, manually select a same-region backup node first; supported other region second.
# A switch can change the public IP; automatic AI failover is NOT implemented.
static=AI-OpenAI, 🇺🇸 自建独享-AI, reject, img-url=https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/ChatGPT.png
static=AI-Claude, 🇺🇸 自建独享-AI, reject, img-url=https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Bot.png
static=AI-Gemini, 🇺🇸 自建独享-AI, reject, img-url=https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Google_Search.png
# Auto availability ONLY for generic international traffic.
available=Intl-Auto, server-tag-regex=香港|日本|新加坡|美国, check-interval=600, img-url=https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Rocket.png
static=Intl-General, Intl-Auto, 🇺🇸 美国-洛杉矶 02丨1x US, img-url=https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Global.png
static=Intl-Google, 🇺🇸 自建独享-AI, reject, img-url=https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Google.png
static=Intl-YouTube, 🇺🇸 自建独享-AI, reject, img-url=https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/YouTube.png
static=Intl-GitHub, Intl-General, img-url=https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/GitHub.png
static=Intl-Social, Intl-General, img-url=https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Telegram.png
static=Media-Netflix, server-tag-regex=日本|新加坡|美国, img-url=https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Netflix.png
static=Media-Disney, server-tag-regex=日本|新加坡|美国, img-url=https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Disney%2B.png

[server_local]
# Add the VLESS + Reality node on the iPhone only.
# Required local tag: 🇺🇸 自建独享-AI
# Do not add server IP, UUID, Reality public key, or Short ID to this repository.

[server_remote]
# Device-local node fragment. Keep this file on the iPhone only:
# Quantumult X/Profiles/private_ai.txt
private_ai.txt, tag=Private-AI-Local, enabled=true
# Keep any airport subscription configured separately on-device.
# Never publish its subscription URL or credentials here.
[filter_remote]
# Conservative maintained remote rules. Specific application resources use the SAME policies
# as existing local rules, so an overlap cannot silently change their chosen policy.
# These resources must successfully download in QX before production acceptance.
https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/QuantumultX/YouTube/YouTube.list, tag=YouTube-Remote, force-policy=Intl-YouTube, update-interval=86400, enabled=true
https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/QuantumultX/GitHub/GitHub.list, tag=GitHub-Remote, force-policy=Intl-GitHub, update-interval=86400, enabled=true
https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/QuantumultX/Telegram/Telegram.list, tag=Telegram-Remote, force-policy=Intl-General, update-interval=86400, enabled=true
# Built-in LAN and regional direct resources; retain existing known-good behavior.
FILTER_LAN, tag=LAN, force-policy=direct, inserted-resource=true, enabled=true
FILTER_REGION, tag=CN, force-policy=direct, inserted-resource=true, enabled=true

