# Quantumult X V2.1 — standalone secret-free acceptance candidate
# AI policies pinned manually; generic international traffic auto-available.
# AI failover is manual: prioritize same region, then another supported region.
# No subscription secrets, certificates, MitM or third-party rewrites.
# Source: qx 001.conf; static audit only, real-device operation not yet verified.

[general]
server_check_url = http://www.google.com/generate_204

[dns]
# Encrypted DNS baseline; DoH changes system DNS behavior. Test captive portal and LAN names.
# IPv6 remains enabled for compatibility; IPv6 and DNS leaks require device tests.
doh-server=https://dns.alidns.com/dns-query
server=/home.arpa/system
server=/local/system

[policy]
static=AI-OpenAI, server-tag-regex=美国-洛杉矶|美国-纽约|美国-西雅图|日本|新加坡
static=AI-Claude, server-tag-regex=美国-洛杉矶|美国-纽约|美国-西雅图|日本|新加坡
static=AI-Gemini, server-tag-regex=美国-洛杉矶|美国-纽约|日本|新加坡
# Auto availability ONLY for generic international traffic.
available=Intl-Auto, server-tag-regex=香港|日本|新加坡|美国, check-interval=600
static=Intl-General, Intl-Auto
static=Intl-Google, Intl-General
static=Intl-YouTube, Intl-General
static=Intl-GitHub, Intl-General
static=Intl-Social, Intl-General
static=Media-Netflix, server-tag-regex=日本|新加坡|美国
static=Media-Disney, server-tag-regex=日本|新加坡|美国

[server_local]

[server_remote]
# Add your private subscription on-device only. No token is stored in this shared profile.
# In QX: add the subscription locally, then update node resources before switching profiles.

[filter_remote]
# Remote rules must successfully download in QX before production acceptance.
https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/QuantumultX/YouTube/YouTube.list, tag=YouTube-Remote, force-policy=Intl-YouTube, update-interval=86400, enabled=true
https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/QuantumultX/GitHub/GitHub.list, tag=GitHub-Remote, force-policy=Intl-GitHub, update-interval=86400, enabled=true
https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/QuantumultX/Telegram/Telegram.list, tag=Telegram-Remote, force-policy=Intl-General, update-interval=86400, enabled=true
FILTER_LAN, tag=LAN, force-policy=direct, inserted-resource=true, enabled=true
FILTER_REGION, tag=CN, force-policy=direct, inserted-resource=true, enabled=true

