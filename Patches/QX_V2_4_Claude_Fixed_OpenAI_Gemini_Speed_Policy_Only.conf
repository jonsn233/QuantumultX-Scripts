# Quantumult X V2.4 policy proposal — user-approved routing preferences
# PATCH ONLY. Not a standalone profile; do not import as a complete config.
# Claude must be manually pinned to verified US LA02 in QX UI.
# OpenAI/Gemini independently benchmark eligible region-tagged nodes.
# A low-latency node is not guaranteed to provide highest throughput or app-level availability.
# All selected regions must be supported by the service; check live service availability before final cutover.

[policy]
url-latency-benchmark=AI-OpenAI-Speed, server-tag-regex=美国|日本|新加坡, check-interval=600
url-latency-benchmark=AI-Gemini-Speed, server-tag-regex=美国|日本|新加坡, check-interval=600
static=AI-OpenAI, AI-OpenAI-Speed, server-tag-regex=美国-洛杉矶|美国-纽约|美国-西雅图|日本|新加坡
static=AI-Claude, server-tag-regex=美国-洛杉矶|美国-纽约|美国-西雅图|日本|新加坡
static=AI-Gemini, AI-Gemini-Speed, server-tag-regex=美国-洛杉矶|美国-纽约|日本|新加坡
# Auto availability ONLY for generic international traffic.
available=Intl-Auto, server-tag-regex=香港|日本|新加坡|美国, check-interval=600
static=Intl-General, Intl-Auto
static=Intl-Google, Intl-General
static=Intl-YouTube, Intl-General
static=Intl-GitHub, Intl-General
static=Intl-Social, Intl-General
static=Media-Netflix, server-tag-regex=日本|新加坡|美国
static=Media-Disney, server-tag-regex=日本|新加坡|美国
