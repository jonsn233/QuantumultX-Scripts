name: Publish Quantumult X rules
on:
  push:
    branches: [main]
    paths:
      - 'Rules/AI/**'
      - 'Rules/Media/**'
      - 'Rules/International/**'
      - 'Rules/Direct/**'
      - 'Tools/build_rules.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    concurrency:
      group: qx-rules-publish-main
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate and build
        run: python3 Tools/build_rules.py
      - name: Commit only when changed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- Rules/QX-V2.5-All-Rules.list; then
            echo "No bundle changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Rules/QX-V2.5-All-Rules.list
          git commit -m "Auto-publish Quantumult X consolidated rules"
          if ! git push origin HEAD:main; then
            echo "::error::Bundle push failed. Check Actions workflow token write permission, branch protection, or concurrent main updates."
            exit 1
          fi
