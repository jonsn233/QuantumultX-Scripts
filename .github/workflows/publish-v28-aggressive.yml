name: V3.0 weekly safe aggressive adblock maintenance
on:
  push:
    branches: [main]
    paths:
      - 'Tools/publish_v28_aggressive_pinned.py'
      - 'Tools/validate_v30_aggressive_release.py'
      - '.github/workflows/publish-v28-aggressive.yml'
  workflow_dispatch:
  schedule:
    - cron: '20 3 * * 1'
permissions:
  contents: write
concurrency:
  group: v28-aggressive-publish
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: true
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Save previous live rules for safe comparison
        run: |
          git show HEAD:Rules/Adblock/Experiments/QX-V2.8-Aggressive-Latest-OptIn.list > /tmp/qx-v30-previous.list
      - name: Generate fresh candidate inventory and risk tiers
        run: |
          python3 Tools/build_cn_adblock_batch.py
          python3 Tools/classify_cn_adblock_batch.py
      - name: Generate independent-source corroboration and full evidence
        run: |
          python3 Tools/corroborate_cn_adblock.py
          python3 Tools/build_v28_broad_evidence.py
      - name: Generate aggressive opt-in rules and SHA256 report
        run: python3 Tools/publish_v28_aggressive_pinned.py
      - name: Fail closed on unsafe rule changes
        run: python3 Tools/validate_v30_aggressive_release.py
      - name: Commit only the separate aggressive opt-in resources
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Rules/Adblock/Experiments/QX-V2.8-Aggressive-Latest-OptIn.list Rules/Adblock/Experiments/QX-V2.8-Aggressive-Report.json
          if git diff --cached --quiet; then
            echo "No changes to publish"
          else
            git commit -m "V3.0 weekly safe refresh of aggressive adblock rules"
            git push
          fi
