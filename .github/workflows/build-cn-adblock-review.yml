name: Build CN adblock review batch (never auto-publish)
on:
  push:
    branches: [main]
    paths:
      - 'Tools/build_cn_adblock_batch.py'
      - 'Tools/test_build_cn_adblock_batch.py'
      - 'Tools/classify_cn_adblock_batch.py'
      - 'Rules/Releases/QX-V2.5-359-Rules.list'
      - 'Rules/Adblock/QX-V2.6-CN-Adblock-Test.list'
      - '.github/workflows/build-cn-adblock-review.yml'
  workflow_dispatch:
  schedule:
    - cron: '15 4 * * 1'
permissions:
  contents: read
jobs:
  review-batch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run bulk builder regression tests
        run: python3 -m unittest discover -s Tools -p "test_build_cn_adblock_batch.py" -v
      - name: Build isolated review candidate and provenance report
        run: python3 Tools/build_cn_adblock_batch.py
      - name: Classify all candidate rules against production and pilot
        run: python3 Tools/classify_cn_adblock_batch.py
      - name: Publish review summary to Actions run
        if: success()
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          p = Path("Rules/Adblock/Generated/QX-CN-Adblock-Bulk-Report.json")
          d = json.loads(p.read_text(encoding="utf-8"))
          print("## CN adblock bulk candidate (review only)")
          print()
          print(f"- Candidate rules: **{d['accepted_count']}**")
          print(f"- Source SHA-256: {d['source_sha256']}")
          print(f"- Active publication: **{d['active_publish']}**")
          print()
          tier = json.loads(Path("Rules/Adblock/Generated/QX-CN-Tier-Report.json").read_text(encoding="utf-8"))
          print()
          print("### Risk-tier review (not approved)")
          for name, count in tier["tiers"].items():
              print(f"- Tier {name}: **{count}**")
          print(f"- V2.5 overlaps: {tier['reasons']['production_overlap']}")
          print(f"- Existing pilot overlaps: {tier['reasons']['pilot_overlap']}")
          print()
          print("| Audit metric | Count |")
          print("|---|---:|")
          for key, value in d["counts"].items():
              print(f"| {key} | {value} |")
          PY
      - name: Upload review-only outputs
        uses: actions/upload-artifact@v4
        with:
          name: qx-cn-adblock-review
          path: |
            Rules/Adblock/Generated/QX-CN-Adblock-Bulk-REVIEW-ONLY.list
            Rules/Adblock/Generated/QX-CN-Adblock-Bulk-Report.json
            Rules/Adblock/Generated/QX-CN-Tier-*-REVIEW-ONLY.list
            Rules/Adblock/Generated/QX-CN-Tier-Report.json
          retention-days: 14
