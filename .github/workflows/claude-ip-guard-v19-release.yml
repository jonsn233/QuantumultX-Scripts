name: Claude IP Guard v19 minimal release checks
on:
  push:
    branches:
      - release/claude-ip-guard-v19-minimal
  pull_request:
    branches:
      - main
  workflow_dispatch:
permissions:
  contents: read
jobs:
  release-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check script syntax
        run: node --check Scripts/Claude/Claude_IP_Guard_QX_v19.js
      - name: Check test syntax
        run: node --check Tests/Claude_IP_Guard_QX_v19_compact.test.cjs
      - name: Run compact UI and exit-policy regression tests
        run: node Tests/Claude_IP_Guard_QX_v19_compact.test.cjs
      - name: Check release identity and native dialog
        run: |
          node - <<'NODE'
          const fs=require('node:fs');
          const assert=require('node:assert/strict');
          const s=fs.readFileSync('Scripts/Claude/Claude_IP_Guard_QX_v19.js','utf8');
          assert.match(s,/var VERSION = "19\.0\.0"/);
          assert.match(s,/\$done\(\{title:/);
          assert.doesNotMatch(s,/htmlMessage/);
          console.log('PASS: version and native result dialog');
          NODE
