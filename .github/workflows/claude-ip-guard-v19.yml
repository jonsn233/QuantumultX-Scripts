name: Claude IP Guard v19 candidate tests

on:
  push:
    branches:
      - dev/claude-ip-guard-v19
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mock-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check v19 JavaScript syntax
        run: node --check Scripts/Claude/v19/Claude_IP_Guard_QX_v19_engine_candidate.js
      - name: Check v19 test syntax
        run: node --check Tests/Claude_IP_Guard_QX_v19.test.cjs
      - name: Execute mocked QX tests
        run: node Tests/Claude_IP_Guard_QX_v19.test.cjs
      - name: Check geo fallback candidate syntax
        run: node --check Scripts/Claude/v19/Claude_IP_Guard_QX_v19_geo_fallback_candidate.js
      - name: Execute geo fallback mocked tests
        run: node Tests/Claude_IP_Guard_QX_v19_geo.test.cjs
      - name: Check reputation candidate syntax
        run: node --check Scripts/Claude/v19/Claude_IP_Guard_QX_v19_reputation_candidate.js
      - name: Check reputation test syntax
        run: node --check Tests/Claude_IP_Guard_QX_v19_reputation.test.cjs
      - name: Execute reputation cache mocked tests
        run: node Tests/Claude_IP_Guard_QX_v19_reputation.test.cjs
      - name: Check dashboard candidate syntax
        run: node --check Scripts/Claude/v19/Claude_IP_Guard_QX_v19_dashboard_candidate.js
      - name: Check dashboard test syntax
        run: node --check Tests/Claude_IP_Guard_QX_v19_dashboard.test.cjs
      - name: Execute dashboard and migration tests
        run: node Tests/Claude_IP_Guard_QX_v19_dashboard.test.cjs
